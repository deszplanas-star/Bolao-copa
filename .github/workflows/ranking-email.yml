name: Daily ranking email

# Todo dia às 01:00 UTC = 22:00 BRT. O script só envia se houve jogo
# encerrado naquele dia (BRT); senão, pula.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {} # permite rodar manualmente pra testar

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar email do ranking
        run: node scripts/send-ranking-email.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
